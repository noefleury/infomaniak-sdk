name: tests

on:
  push

jobs:

  tests:

    strategy:

      fail-fast: false

      matrix:

        os:
          - ubuntu-latest
          - windows-latest

        php_version:
          - 8.3
          - 8.4

    runs-on: ${{ matrix.os }}

    name: Testing with PHP ${{ matrix.php_version }} running on ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: curl json
          tools: composer:v2

      - name: Install dependencies
        run: composer install

      - name: Running tests
        run: composer test
